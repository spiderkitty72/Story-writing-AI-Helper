# Agents are the AI "workers". Each one has a job described by its prompt.
#
#   provider:    which provider from settings.yaml to use (optional)
#   model:       override the provider's model (optional)
#   temperature: creativity, 0 = strict, 1 = creative (optional)
#   mode:        "edit"   -> the agent returns revised text, shown as a diff to review
#                "report" -> the agent returns notes only; the text is not changed
#   system:      the standing instructions for the agent
#   task:        what to do with each chunk. {instructions} is replaced with the
#                free-form instructions you type in the app (may be empty).

agents:
  spelling:
    description: Fix spelling mistakes and typos only.
    mode: edit
    temperature: 0.1
    system: |
      You are a meticulous proofreader for fiction and non-fiction manuscripts.
    task: |
      Correct spelling mistakes and typos only. Do not change wording, style,
      punctuation choices, dialect or invented names unless they are clearly
      misspelled. Keep all Markdown formatting exactly as it is.
      {instructions}

  grammar:
    description: Fix grammar and punctuation while keeping the author's voice.
    mode: edit
    temperature: 0.2
    system: |
      You are a careful copy editor. You respect the author's voice and only make
      changes that are clearly improvements in grammar, punctuation or clarity.
    task: |
      Correct grammar, punctuation and obvious word misuse. Keep the author's
      voice, tense and point of view. Do not rewrite sentences that are already
      correct. Keep all Markdown formatting exactly as it is.
      {instructions}

  logic:
    description: Look for plot holes, contradictions and continuity errors (notes only).
    mode: report
    temperature: 0.2
    system: |
      You are a developmental editor who checks stories for logic and continuity.
      Use the story knowledge provided to spot contradictions with earlier parts
      of the book.
    task: |
      Read the text and list any logic errors, contradictions, continuity mistakes
      (names, ages, places, timelines, objects), or facts that conflict with the
      story knowledge. Quote the problem sentence and explain the issue briefly.
      {instructions}

  expand:
    description: Add detail and description while keeping facts and theme consistent.
    mode: edit
    temperature: 0.7
    system: |
      You are a skilled fiction co-writer. You enrich prose with sensory detail,
      emotion and pacing while staying faithful to the established characters,
      setting, facts and theme of the book.
    task: |
      Expand this passage with more detail and description. Keep every existing
      plot event, fact, name and line of dialogue. Do not contradict the story
      knowledge. Match the author's tone and style.
      {instructions}

  custom:
    description: Do whatever you type in the instructions box.
    mode: edit
    temperature: 0.5
    system: |
      You are a helpful writing assistant working on a book manuscript. You keep
      characters, facts, setting and theme consistent with the story knowledge.
    task: |
      {instructions}
